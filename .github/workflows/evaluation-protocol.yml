name: Evaluation protocol regression
on:
  push:
    paths: ['rbac-exp/evaluation/**', 'tests/test_evaluation_protocol.py', 'requirements-eval.txt', '.github/workflows/evaluation-protocol.yml']
  pull_request:
    paths: ['rbac-exp/evaluation/**', 'tests/test_evaluation_protocol.py', 'requirements-eval.txt', '.github/workflows/evaluation-protocol.yml']
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-eval.txt
      - run: python -m unittest discover -s tests -p test_evaluation_protocol.py -v
