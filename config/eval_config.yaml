pg:
  host: localhost
  port: 5432
  dbname: spider_benchmark
  user: postgres
  password: postgres
  search_path: public

model:
  provider: local
  endpoint: null
  template: chatml
  max_new_tokens: 512
  temperature: 0
  top_p: 1

limits:
  statement_timeout_ms: 30000
  max_result_rows: 1000
  single_statement: true

compliance:
  static_checker: sqlglot
  whitelist_source: information_schema

schema_injection:
  strategy: subschema
  fk_hops: 1
